# Redis configuration for Lex-Integrity
redis.conf:
  # Port
  port 6379
  
  # Security
  requirepass ${REDIS_PASSWORD:-}
  
  # Memory management
  maxmemory 1gb
  maxmemory-policy allkeys-lru
  
  # Logging
  logfile "/var/log/redis/redis-server.log"
  loglevel "notice"
  
  # Persistence
  save 900 1
  save 300 10
  save 60 10000
  
  # Database
  databases 16
  
  # Performance
  appendonly yes
  appendfilename "appendonly.aof"
  appendfsync everysec
  
  # Client connections
  client-output-buffer-limit normal 0 0 0
  client-output-buffer-limit slave 256mb 64mb 60
  client-output-buffer-limit pubsub 32mb 8mb 60
  
  # Monitoring
  slowlog-log-slower-than 10000
  slowlog-max-len 128
  
  # Other
  hash-max-ziplist-entries 512
  hash-max-ziplist-value 64
  zset-max-ziplist-entries 128
  zset-max-ziplist-value 64
  activate-key-prelaunch default no

# Docker Compose for Lex-Integrity
docker-compose.yml:
  version: '3.8'
  
  services:
    mongodb:
      image: mongo:7.0
      container_name: lex-integrity-mongodb
      restart: unless-stopped
      environment:
        MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
        MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
        MONGO_INITDB_DATABASE: lex_integrity
      volumes:
        - mongodb_data:/data/db
        - ./server/scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      ports:
        - "27017:27017"
      networks:
        - lex-network
      healthcheck:
        test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
        interval: 10s
        timeout: 10s
        retries: 5
    
    redis:
      image: redis:7-alpine
      container_name: lex-integrity-redis
n    restart: unless-stopped
      environment:
        REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass}
      command: redis-server /usr/local/etc/redis/redis.conf
      volumes:
        - redis_data:/data
        - ./server/config/redis.conf:/usr/local/etc/redis/redis.conf:ro
      ports:
        - "6379:6379"
      networks:
        - lex-network
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 10s
        retries: 5
    
    # Optional: Local LLM service (if using Ollama directly)
    # ollama:
    #   image: ollama/ollama:latest
    #   container_name: lex-integrity-ollama
    #   restart: unless-stopped
    #   ports:
    #     - "11434:11434"
    #   volumes:
    #     - ollama_data:/root/.ollama
    #   networks:
    #     - lex-network
    #   deploy:
    #     resources:
    #       limits:
    #         cpus: '4'
    #         memory: 16G
    
    backend:
      build: ./server
      container_name: lex-integrity-backend
      restart: unless-stopped
      environment:
        NODE_ENV: development
        PORT: 3000
        MONGODB_URI: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-password}@mongodb:27017/lex_integrity
        REDIS_URL: redis://:${REDIS_PASSWORD:-redispass}@redis:6379
        JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_here}
      ports:
        - "3000:3000"
      depends_on:
        mongodb:
          condition: service_healthy
        redis:
          condition: service_healthy
      networks:
        - lex-network
    
    # Frontend (for development)
    frontend:
      build: ./client
      container_name: lex-integrity-frontend
      restart: unless-stopped
      ports:
        - "3001:3000"
      depends_on:
        - backend
      networks:
        - lex-network
    
    # Queue worker for BullMQ
    worker:
      build: ./server
      container_name: lex-integrity-worker
      restart: unless-stopped
      environment:
        NODE_ENV: development
        MONGODB_URI: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-password}@mongodb:27017/lex_integrity
        REDIS_URL: redis://:${REDIS_PASSWORD:-redispass}@redis:6379
      command: node src/worker.js
      depends_on:
        mongodb:
          condition: service_healthy
        redis:
          condition: service_healthy
      networks:
        - lex-network
    
    # Monitoring (optional)
    # prometheus:
    #   image: prom/prometheus
    #   container_name: lex-integrity-prometheus
    #   restart: unless-stopped
    #   ports:
    #     - "9090:9090"
    #   volumes:
    #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    #   networks:
    #     - lex-network
    
    # Grafana (optional)
    # grafana:
    #   image: grafana/grafana
    #   container_name: lex-integrity-grafana
    #   restart: unless-stopped
    #   ports:
    #     - "3002:3000"
    #   environment:
    #     GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    #   volumes:
    #     - grafana_data:/var/lib/grafana
    #   networks:
    #     - lex-network
    
  volumes:
    mongodb_data:
    redis_data:
    # ollama_data:
    # grafana_data:
  
  networks:
    lex-network:
      driver: bridge

# Docker-compose.override.yml (for development)
docker-compose.override.yml:
  version: '3.8'
  services:
    backend:
      volumes:
        - ./server:/app/server
        - /app/server/node_modules
      environment:
        NODE_ENV: development
      ports:
        - "3000:3000"
        - "9229:9229"
    
    mongodb:
      command: mongod --replSet rs0 --bind_ip_all
      volumes:
        - mongodb_data:/data/db
        - ./server/scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    
    redis:
      command: redis-server /usr/local/etc/redis/redis.conf
      volumes:
        - redis_data:/data
        - ./server/config/redis.conf:/usr/local/etc/redis/redis.conf:ro